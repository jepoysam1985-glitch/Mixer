<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>JEIANNE FM Mixer</title>
<script src="lame.min.js"></script>
<style>
:root{--bg:#0a0a12;--panel:#13131f;--panel2:#1b1b2c;--line:#272742;--txt:#f1f1f8;--dim:#c9c9e2;--c1:#22d3ee;--c2:#f472b6;--acc:#8b5cf6;--live:#ff3355;--ok:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0 auto;max-width:640px;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overflow-x:hidden;color:var(--txt);font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(120% 50% at 50% -8%,#2a1d56 0%,transparent 70%)}
h1{font-size:15px;letter-spacing:3px;text-align:center;margin:6px 0 14px;font-weight:800;background:linear-gradient(90deg,var(--c1),var(--acc),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.topbar h1{flex:1;margin:0}
#gearBtn,#mixBtn{flex:none;width:44px;height:44px;border-radius:50%;font-size:20px;padding:0;line-height:1}
.modal{position:fixed;inset:0;z-index:100;background:#000c;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:520px;margin:auto 0;box-shadow:0 10px 40px #000}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheethead b{font-size:14px}
#closeSettings,#closeMix{flex:none;width:42px;height:42px;border-radius:50%;font-size:18px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:0 6px 24px #0008}
.decks{display:grid;grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr);gap:5px;margin-bottom:12px}
.decks .card{margin:0}
#deck0{--c:var(--c1)}#deck1{--c:var(--c2)}
.deck{border-top:3px solid var(--c)}
.deck h2{font-size:12px;font-weight:800;letter-spacing:2px;margin:0 0 8px;color:var(--c)}
.now{font-size:13px;font-weight:700;line-height:1.3;min-height:42px;background:#0b0b14;border-left:3px solid var(--c);border-radius:10px;padding:8px 10px;overflow:hidden;word-break:break-word;display:flex;align-items:center}
.time{font-size:11.5px;color:var(--dim);margin:6px 2px 0;font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0}
button{background:#232338;color:var(--txt);border:1px solid #33334f;border-radius:12px;padding:0;height:44px;font-size:11.5px;font-weight:700;letter-spacing:.3px;transition:transform .08s,background .15s}
button:active{transform:scale(.95);background:#33334f}
button.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 14px #8b5cf688}
.deck button.on{background:var(--c);border-color:var(--c);color:#06060c;box-shadow:0 0 14px var(--c)}
.addrow{display:grid;grid-template-columns:1fr;gap:5px;margin-top:6px}
.addrow button{height:38px;background:transparent;border-style:dashed}
.deck.locked .btns button:not(.lockbtn),.deck.locked .addrow,.deck.locked ul{opacity:.4;pointer-events:none}
ul{list-style:none;margin:8px 0 0;padding:0;max-height:150px;overflow:auto;font-size:12.5px}
li{padding:8px;border-radius:9px;margin-bottom:3px;background:#0f0f19;color:#ececf8;word-break:break-word}
li.cur{background:#26264a;color:#fff;border-left:3px solid var(--c)}
li{display:flex;align-items:center;gap:6px}
li span{flex:1;min-width:0}
li .x{flex:none;min-width:34px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#2a1b24;color:#ff7b8f;font-size:12px}
li .x:active{background:#4a2232}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#d9d9f0;margin:14px 0 6px}
label b{color:var(--txt)}
.chk{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--txt);margin-top:14px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;outline:none;margin:6px 0;--v:50%;--cc:var(--acc);background:linear-gradient(90deg,var(--cc) var(--v),#2a2a44 var(--v))}
.deck input[type=range]{--cc:var(--c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid var(--cc);box-shadow:0 2px 8px #000a}
#cross{background:linear-gradient(90deg,var(--c1),var(--c2))}
#cross::-webkit-slider-thumb{background:#14141f;border-color:#fff}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}.row>*{flex:1}
#autoBtn,#mixSec{height:46px}
#duckBtn,#micBtn,#monBtn,#micMonBtn{height:60px;font-size:10.5px;line-height:1.2;white-space:pre-line;padding:0 2px;min-width:0}
#micMonBtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
#micBtn.on{background:var(--ok);border-color:var(--ok);color:#04130a;box-shadow:0 0 16px #22c55e88}
.meter{height:14px;background:#0b0b14;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),#e5c82d 70%,var(--live))}
::placeholder{color:#9a9ab8;opacity:1}
input[type=text],input[type=password],input[type=number],select{width:100%;padding:12px;border-radius:12px;border:1px solid #33334f;background:#0c0c16;color:var(--txt);font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #8b5cf655}
summary{font-weight:700;font-size:14px;padding:6px 0}
.hint{font-size:11.5px;color:var(--dim);line-height:1.55;margin-top:10px}
.card:has(#liveBtn){position:sticky;bottom:max(8px,env(safe-area-inset-bottom));z-index:5;background:#0f0f1a;border-color:#3a3a5c;box-shadow:0 -10px 30px #000d;margin-bottom:12px}
button.big{width:100%;height:60px;font-size:15px;letter-spacing:1px;border:0;border-radius:16px;color:#fff;background:linear-gradient(135deg,#ff3355,#ff6a3d);box-shadow:0 6px 20px #ff335566}
button.big.live{background:linear-gradient(135deg,#7a0f20,#ff3355);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ff335599}50%{box-shadow:0 0 0 12px #ff335500}}
#status{font-size:13px;text-align:center;margin-top:10px;color:var(--dim);min-height:18px;font-variant-numeric:tabular-nums}
#status.live{color:#ff6b81;font-weight:800}
.spec{display:block;width:100%;height:48px;margin:8px 0 2px;background:#0b0b14;border-radius:10px}
/* EFFECTS pads: bilog, iba-iba ang kulay */
.fxgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 4px}
.fxcell{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.pad{position:relative;width:100%;max-width:50px;height:auto;aspect-ratio:1/1;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#0b0b14;background:var(--pc);border:2px solid var(--pc);box-shadow:inset 0 -6px 9px #0004,inset 0 4px 6px #fff5,0 3px 9px #0009}
.pad.empty{background:transparent;border:2px dashed var(--pc);color:var(--pc);box-shadow:none;opacity:.75;font-size:18px;font-weight:400}
.pad.on{background:#fff;border-color:var(--pc);transform:scale(1.08);box-shadow:0 0 0 3px var(--pc),0 0 18px var(--pc);color:#0b0b14}
.pad:active{transform:scale(.93)}
.pad .x{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:#4a2232;color:#ff7b8f;border:2px solid #0f0f1a;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.cap{font-size:10px;font-weight:600;line-height:1.2;color:#ececf8;text-align:center;max-width:100%;min-height:24px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
@media (max-width:420px){
  body{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
  h1{font-size:13.5px;letter-spacing:1.5px;margin:2px 0 10px}
  .topbar h1{margin:0}
  .card{padding:9px;border-radius:14px;margin-bottom:10px}
  .decks{gap:4px;margin-bottom:10px}
  .deck .btns button,.addrow button{font-size:11px}
  .deck h2{font-size:11.5px;margin-bottom:6px}
  .now{font-size:12.5px;min-height:42px;padding:6px 8px}
  .btns{grid-template-columns:1fr 1fr;gap:5px;margin:6px 0}
  button{height:40px;font-size:11.5px}
  .addrow button{height:40px;font-size:11.5px}
  ul{max-height:110px;font-size:12px}
  li{padding:7px}
  .spec{height:38px}
  #duckBtn,#micBtn,#monBtn,#micMonBtn{font-size:10.5px;height:60px}
  #autoBtn{font-size:11px;padding:0 4px}
  button.big{height:54px;font-size:14.5px}
  .hint{font-size:11px}
}
@media (max-width:340px){h1{font-size:12px;letter-spacing:1px}#duckBtn,#micBtn,#monBtn,#micMonBtn,#liveBtn{font-size:9.5px}}
.card.vgain{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;padding:10px 2px}
.vcol{display:flex;flex-direction:column;align-items:center;gap:6px;width:48px}
.vl{font-size:10px;font-weight:700;line-height:1.2;color:#d9d9f0;text-transform:uppercase;text-align:center}
.vslot{height:22px;display:flex;align-items:center;justify-content:center}
.vslide{position:relative;width:40px;height:210px}
.vslide input{position:absolute;left:50%;top:50%;width:210px;margin:0;transform:translate(-50%,-50%) rotate(-90deg)}
.vslide input.vcross{transform:translate(-50%,-50%) rotate(90deg)}   /* 0 = Deck 1 (taas), 100 = Deck 2 (baba) */
.vdb{font-size:10px;color:var(--txt);font-variant-numeric:tabular-nums;white-space:nowrap}
.vtag{width:22px;height:22px;border-radius:50%;font-style:normal;font-size:11px;font-weight:800;color:#06060c;display:flex;align-items:center;justify-content:center}
.mqw{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.mq{display:inline-block;will-change:transform}
.mq.run{animation:mq var(--dur,8s) ease-in-out infinite alternate}
@keyframes mq{0%,14%{transform:translateX(0)}86%,100%{transform:translateX(var(--dist,0px))}}
@media (prefers-reduced-motion:reduce){.mq.run{animation:none}}
#liveBtn{flex:1.4;width:auto;height:60px;font-size:11.5px;letter-spacing:.3px;line-height:1.2;white-space:pre-line;padding:0 2px;border-radius:12px;min-width:0}
#status{margin-top:8px}
</style>
</head>
<body>
<div class="topbar"><button id="mixBtn" aria-label="Open audio settings">🎚</button><h1>🎙 JEIANNE FM MIXER</h1><button id="gearBtn" aria-label="Open output settings">⚙</button></div>

<div class="modal" id="out" hidden>
<div class="card sheet" role="dialog" aria-label="Output Settings">
  <div class="sheethead"><b>Output Settings (Encoder)</b><button id="closeSettings" aria-label="Close settings">✕</button></div>
  <label for="o_mode">Output mode</label>
  <select id="o_mode">
    <option value="icecast">Icecast Server</option>
    <option value="shoutcast">Shoutcast Server (v1)</option>
  </select>
  <label for="o_host">Server / Host</label>
  <input type="text" id="o_host" placeholder="e.g. stream-xx.zeno.fm" autocapitalize="off" autocomplete="off" spellcheck="false">
  <label for="o_port">Port</label>
  <input type="number" id="o_port" inputmode="numeric" placeholder="e.g. 8000">
  <div id="o_mountbox">
    <label for="o_mount">Mount point</label>
    <input type="text" id="o_mount" placeholder="e.g. /abc123" autocapitalize="off" autocomplete="off" spellcheck="false">
    <label for="o_user">Username</label>
    <input type="text" id="o_user" value="source" autocapitalize="off" autocomplete="off" spellcheck="false">
  </div>
  <label for="o_pass">Password</label>
  <input type="password" id="o_pass" autocomplete="off">
  <label for="o_br">Bitrate</label>
  <select id="o_br">
    <option value="64k">64 kbps</option>
    <option value="96k">96 kbps</option>
    <option value="128k" selected>128 kbps</option>
    <option value="192k">192 kbps</option>
  </select>
  <button id="closeSettings2" style="width:100%;height:50px;margin-top:14px;background:var(--acc);border-color:var(--acc);color:#fff;font-size:13.5px">Done</button>
</div>
</div>

<div class="modal" id="mixSettings" hidden>
<div class="card sheet" role="dialog" aria-label="Audio Settings">
  <div class="sheethead"><b>Audio Settings</b><button id="closeMix" aria-label="Close audio settings">✕</button></div>
  <label style="margin-top:14px">Effects Volume: <b id="fxv">100%</b></label>
  <input type="range" min="0" max="150" value="100" id="fxVol">
  <label>Microphone Gain: <b id="mgdb">0.0 dB</b></label>
  <input type="range" min="0" max="200" value="100" id="micGain">
  <label for="nrLvl">Mic Noise Reduction</label>
  <select id="nrLvl">
    <option value="0">Off</option>
    <option value="1">Low (light)</option>
    <option value="2" selected>Medium</option>
    <option value="3">High (strong)</option>
  </select>
  <label>Mic Echo: <b id="echov">25%</b></label>
  <input type="range" min="0" max="100" value="25" id="echoAmt">
  <select id="echoTime" style="margin-top:6px">
    <option value="0.15">Echo: Fast (0.15s)</option>
    <option value="0.3" selected>Echo: Normal (0.3s)</option>
    <option value="0.45">Echo: Long (0.45s)</option>
  </select>
  <label>Music level while speaking: <b id="duckv">25%</b></label>
  <input type="range" min="0" max="100" value="25" id="duckLvl">
  <button id="closeMix2" style="width:100%;height:50px;margin-top:16px;background:var(--acc);border-color:var(--acc);color:#fff;font-size:13.5px">Done</button>
</div>
</div>

<div class="decks">
  <div class="card deck" id="deck0">
    <h2>DECK 1</h2>
    <div class="now" id="now0">No track</div>
    <div class="time" id="time0">0:00 / 0:00</div>
    <div class="btns">
      <button data-a="play">▶</button><button data-a="stop">■</button>
      <button data-a="mute">MUTE</button><button data-a="lock" class="lockbtn">LOCK</button>
    </div>
    <label>Volume</label><input type="range" min="0" max="100" value="100" data-a="vol">
    <div class="addrow"><button data-a="add">+ Add Tracks</button></div>
    <ul id="list0"></ul>
    <input type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac" multiple hidden id="file0">
  </div>
  <div class="card vgain">
    <div class="vcol">
      <span class="vl">Tracks<br>Gain</span>
      <span class="vslot"></span>
      <div class="vslide"><input type="range" min="0" max="150" value="100" id="tracksGain" aria-label="Tracks Gain"></div>
      <span class="vslot"><b id="tgdb" class="vdb">0.0 dB</b></span>
    </div>
    <div class="vcol">
      <span class="vl">Cross<br>fader</span>
      <span class="vslot"><i class="vtag" style="background:var(--c1)">1</i></span>
      <div class="vslide"><input type="range" min="0" max="100" value="50" id="cross" class="vcross" aria-label="Crossfader: Deck 1 (top) to Deck 2 (bottom)"></div>
      <span class="vslot"><i class="vtag" style="background:var(--c2)">2</i></span>
    </div>
  </div>
  <div class="card deck" id="deck1">
    <h2>DECK 2</h2>
    <div class="now" id="now1">No track</div>
    <div class="time" id="time1">0:00 / 0:00</div>
    <div class="btns">
      <button data-a="play">▶</button><button data-a="stop">■</button>
      <button data-a="mute">MUTE</button><button data-a="lock" class="lockbtn">LOCK</button>
    </div>
    <label>Volume</label><input type="range" min="0" max="100" value="100" data-a="vol">
    <div class="addrow"><button data-a="add">+ Add Tracks</button></div>
    <ul id="list1"></ul>
    <input type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac" multiple hidden id="file1">
  </div>
</div>

<div class="meter" style="margin:0 0 12px"><i id="meter"></i></div>

<div class="card" id="xfCard">
  <div class="row" style="margin-top:0">
    <button id="autoBtn">🔀 AUTO-MIX: OFF</button>
    <select id="mixSec">
      <option value="3">Crossfade 3s</option>
      <option value="5" selected>Crossfade 5s</option>
      <option value="8">Crossfade 8s</option>
      <option value="12">Crossfade 12s</option>
    </select>
  </div>
</div>

<div class="card" id="micCard">
  <div class="row" style="margin-top:0;gap:4px">
    <button id="duckBtn">🔉
Auto-duck
OFF</button>
    <button id="micBtn">🎤
MIC
OFF</button>
    <button class="big" id="liveBtn">🔴
GO LIVE</button>
    <button id="monBtn">🔈
Monitor
ON</button>
    <button id="micMonBtn">🎧
Hear Mic
OFF</button>
  </div>
  <div id="status">Not live</div>
</div>

<div class="card" id="fxCard">
  <label style="margin-top:0">🔔 Effects (12 slots)</label>
  <div class="fxgrid" id="fxGrid"></div>
  <div class="row">
    <button id="fxEdit" style="height:44px">✎ Edit slots</button>
    <button id="fxStop" style="height:44px">⏹ Stop all</button>
  </div>
  <input type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac" multiple hidden id="fxFile">
</div>





<script>
const $ = (s) => document.querySelector(s);
const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
const master = ctx.createGain();
const tracksGain = ctx.createGain();
const duckGain = ctx.createGain();
const micGain = ctx.createGain();
const analyser = ctx.createAnalyser();
analyser.fftSize = 512;
const dest = ctx.createMediaStreamDestination();
const monitor = ctx.createGain();
const limiter = ctx.createDynamicsCompressor();   // proteksyon laban sa clipping/distortion sa stream
limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20;
limiter.attack.value = 0.003; limiter.release.value = 0.25;

tracksGain.connect(duckGain);
duckGain.connect(master);
micGain.connect(master);
master.connect(limiter);
limiter.connect(analyser);
limiter.connect(dest);
duckGain.connect(monitor);          // ang kanta lang ang naririnig sa phone (iwas feedback sa mic)
monitor.connect(ctx.destination);

// ECHO ng mic: delay na may feedback at lowpass para natural ang tunog
const echoDelay = ctx.createDelay(1.0); echoDelay.delayTime.value = 0.3;
const echoTone = ctx.createBiquadFilter(); echoTone.type = 'lowpass'; echoTone.frequency.value = 3500;
const echoFb = ctx.createGain(); echoFb.gain.value = 0.4;
const echoWet = ctx.createGain(); echoWet.gain.value = 0.25;
micGain.connect(echoDelay); echoDelay.connect(echoTone);
echoTone.connect(echoFb); echoFb.connect(echoDelay);
echoTone.connect(echoWet); echoWet.connect(master);
// PAKINGGAN ANG MIC (boses + echo) sa headphone/Bluetooth; hindi ito kasama sa stream, pang-monitor lang
const micMon = ctx.createGain(); micMon.gain.value = 0;
micGain.connect(micMon); echoWet.connect(micMon); micMon.connect(ctx.destination);
// pang-detect ng boses para sa auto-duck
const micAn = ctx.createAnalyser(); micAn.fftSize = 1024;
micGain.connect(micAn);
// NOISE REDUCTION: high-pass (tanggal ang ugong/rumble) + noise gate (hinihinaan ang ingay kapag hindi nagsasalita)
const micIn = ctx.createGain();
const micHP = ctx.createBiquadFilter(); micHP.type = 'highpass'; micHP.frequency.value = 90; micHP.Q.value = 0.7;
const gate = ctx.createGain();
const gateAn = ctx.createAnalyser(); gateAn.fftSize = 1024;
micIn.connect(micHP); micHP.connect(gate); micHP.connect(gateAn); gate.connect(micGain);

const decks = [0, 1].map((i) => {
  const audio = new Audio();
  audio.preload = 'auto';
  const src = ctx.createMediaElementSource(audio);
  const fader = ctx.createGain();
  const cross = ctx.createGain();
  src.connect(fader); fader.connect(cross); cross.connect(tracksGain);
  const d = { i, audio, fader, cross, list: [], idx: -1, muted: false, locked: false, vol: 1, loads: 0, orphan: false };
  audio.addEventListener('ended', () => onEnded(d));
  audio.addEventListener('timeupdate', () => {
    $('#time' + i).textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration || 0);
  });
  return d;
});

function fmt(s) {
  if (!isFinite(s)) return '0:00';
  s = Math.floor(s);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function applyCross() {
  const v = $('#cross').value / 100;
  decks[0].cross.gain.value = Math.cos(v * Math.PI / 2);
  decks[1].cross.gain.value = Math.cos((1 - v) * Math.PI / 2);
}

let autoMix = false, mixSec = 5, fading = false;
function cueNext(d) {            // ihanda (hindi i-play) ang susunod na kanta ng deck

function mixTo(from, to) {
  fading = true;

  to.audio.play().catch(() => {});

  const slider = $('#cross');
  const start = parseFloat(slider.value), end = to.i === 1 ? 100 : 0;
  const t0 = performance.now(), dur = Math.max(1, Math.min(mixSec, (from.audio.duration || mixSec) - from.audio.currentTime)) * 1000;
  const tm = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / dur);
    slider.value = start + (end - start) * k;
    applyCross();

      clearInterval(tm);
      fading = false;
      from.audio.pause();
      if (from.loads === startLoads) { dropFinished(from); cueNext(from); }   // iwas double-advance kung tumawag na ang onEnded

}, 250);

// EFFECTS: 8 slot ng jingle/sound effect (kasama sa stream; naka-save sa IndexedDB ng phone)
const FX_N = 12;
const fxGain = ctx.createGain(); fxGain.gain.value = 1;
fxGain.connect(master); fxGain.connect(monitor);
const fx = Array.from({ length: FX_N }, () => ({ name: '', buf: null, src: null }));
let fxEdit = false, fxTarget = -1;
const fxDB = () => new Promise((res, rej) => {
  const r = indexedDB.open('jfm', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('fx');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});

    await Promise.all([...Array(FX_N).keys()].map((i) => new Promise((res) => {
      const q = db.transaction('fx').objectStore('fx').get(i);
      q.onsuccess = async () => {
        const v = q.result;
        if (v) { try { fx[i].buf = await ctx.decodeAudioData(v.data.slice(0)); fx[i].name = v.name; } catch {} }

}

  s.onended = () => { if (f.src === s) { f.src = null; fxRender(); } };

}

  try {
    const data = await file.arrayBuffer();
    const buf = await ctx.decodeAudioData(data.slice(0));
    if (buf.duration > 90) { alert('That file is too long (' + Math.round(buf.duration) + 's). Effects can be up to 90 seconds.'); return; }
    fxStopSlot(i); fx[i].buf = buf; fx[i].name = file.name.replace(/\.[^.]+$/, '');
    fxSave(i, fx[i].name, data); fxRender();
  } catch { alert('Could not read that audio file.'); }
}
const FX_COLORS = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#d946ef', '#ec4899', '#14b8a6', '#e5e7eb'];

  const g = $('#fxGrid'); g.innerHTML = '';
  fx.forEach((f, i) => {
    const cell = document.createElement('div'); cell.className = 'fxcell';
    const b = document.createElement('button');
    b.className = 'pad' + (f.buf ? '' : ' empty') + (f.src ? ' on' : '');
    b.style.setProperty('--pc', FX_COLORS[i]);

  if (was && Tcp) Tcp.close().catch(() => {});
  if (wake) { wake.release().catch(() => {}); wake = null; }
  $('#liveBtn').textContent = '🔴\nGO LIVE';
  $('#liveBtn').classList.remove('live');
  setStatus(msg || 'Not live', false);
}
async function goLive() {
  if (ws) { stopLive('Broadcast ended'); return; }
  const c = getCfg(), miss = [];
  if (!c.host) miss.push('Server/Host');
  if (!c.port || isNaN(c.port) || +c.port < 1 || +c.port > 65535) miss.push('Port');
  if (c.mode === 'icecast' && !c.mount) miss.push('Mount point');
  if (c.mode === 'icecast' && !c.user) miss.push('Username');
  if (!c.password) miss.push('Password');
  if (miss.length) { showSettings(true); setStatus('Missing: ' + miss.join(', '), false); return; }
  if (!Tcp) { setStatus('This only works in the APK app, not in a browser', false); return; }
  if (!window.lamejs) { setStatus('lame.min.js (MP3 encoder) is missing', false); return; }
  if (!micStream && !confirm('Your mic is OFF. Go live without your voice anyway?')) { setStatus('Turn on 🎤 MIC first', false); return; }
  await ctx.resume();
  setStatus('Connecting...', false);
  ws = {}; q = Promise.resolve(); pending = 0; dropped = 0;
  const br = parseInt(c.bitrate, 10) || 128;
  try {
    await Tcp.connect({ host: c.host, port: parseInt(c.port, 10) });
    const rd = async (ms) => (await Tcp.read({ timeoutMs: ms })).text || '';
    if (c.mode === 'shoutcast') {
      await Tcp.write({ data: b64(te(c.password + '\r\n')) });
      if (!/OK2/i.test(await rd(8000))) throw new Error('Wrong Shoutcast password or port');
      await Tcp.write({ data: b64(te('icy-name: JEIANNE FM\r\nicy-pub: 1\r\nicy-br: ' + br + '\r\ncontent-type: audio/mpeg\r\n\r\n')) });
    } else {
      const mount = c.mount.startsWith('/') ? c.mount : '/' + c.mount;
      const auth = b64(te(c.user + ':' + c.password));
      await Tcp.write({ data: b64(te('PUT ' + mount + ' HTTP/1.1\r\nHost: ' + c.host + ':' + c.port + '\r\nAuthorization: Basic ' + auth +
        '\r\nUser-Agent: JeianneFM\r\nContent-Type: audio/mpeg\r\nIce-Name: JEIANNE FM\r\nIce-Public: 1\r\nIce-Bitrate: ' + br + '\r\n\r\n')) });
      const r = await rd(8000);
      if (!/^HTTP\/1\.\d (100|200)/.test(r)) throw new Error('Rejected by Icecast: ' + (r.split('\r\n')[0] || 'no response'));
    }
    if (!ws) return;
    enc = new lamejs.Mp3Encoder(2, ctx.sampleRate, br);
    proc = ctx.createScriptProcessor(4096, 2, 2);
    const mute = ctx.createGain(); mute.gain.value = 0;
    limiter.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
    proc.onaudioprocess = (e) => {
      if (!enc) return;
      const out = enc.encodeBuffer(toI16(e.inputBuffer.getChannelData(0)), toI16(e.inputBuffer.getChannelData(1)));
      if (out.length) sendBytes(out);
    };
    liveSince = Date.now();
    $('#liveBtn').textContent = '■\nEND LIVE';
    $('#liveBtn').classList.add('live');
    timer = setInterval(() => setStatus('🔴 LIVE  ' + fmt((Date.now() - liveSince) / 1000), true), 1000);
    setStatus('🔴 LIVE', true);
    if (navigator.wakeLock) navigator.wakeLock.request('screen').then((w) => (wake = w)).catch(() => {});
  } catch (e) { stopLive(e.message || String(e)); }
}

function getCfg() {
  return {
    mode: $('#o_mode').value, host: $('#o_host').value.trim(), port: $('#o_port').value.trim(),
    mount: $('#o_mount').value.trim(), user: $('#o_user').value.trim(),
    password: $('#o_pass').value, bitrate: $('#o_br').value,
  };
}
function saveCfg() {
  try { localStorage.setItem('jfm_cfg', JSON.stringify(getCfg())); } catch {}
  $('#o_mountbox').style.display = $('#o_mode').value === 'icecast' ? 'block' : 'none';
}
try {
  const c = JSON.parse(localStorage.getItem('jfm_cfg') || 'null');
  if (c) {
    $('#o_mode').value = c.mode || 'icecast'; $('#o_host').value = c.host || ''; $('#o_port').value = c.port || '';
    $('#o_mount').value = c.mount || ''; $('#o_user').value = c.user || 'source';
    $('#o_pass').value = c.password || ''; $('#o_br').value = c.bitrate || '128k';
  }
} catch {}
['o_mode', 'o_host', 'o_port', 'o_mount', 'o_user', 'o_pass', 'o_br'].forEach((id) => {
  $('#' + id).addEventListener('input', saveCfg);
  $('#' + id).addEventListener('change', saveCfg);
});
saveCfg();
$('#liveBtn').onclick = goLive;
window.addEventListener('beforeunload', (e) => { if (ws) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && ws && navigator.wakeLock && !wake)
    navigator.wakeLock.request('screen').then((w) => (wake = w)).catch(() => {});
});
</script>

<script>
// SPECTRUM ng Deck 1 at Deck 2 (kinukuha pagkatapos ng volume/crossfader ng bawat deck, bago ang Tracks Gain, ducking at limiter)
(function () {
  const N = 28, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const specs = decks.map((d) => {
    const an = ctx.createAnalyser();
    an.fftSize = 256; an.smoothingTimeConstant = 0.75;
    d.cross.connect(an);
    const root = document.getElementById('deck' + d.i);
    const cv = document.createElement('canvas');
    cv.className = 'spec';
    root.querySelector('.time').after(cv);
    return { an, cv, g: cv.getContext('2d'), data: new Uint8Array(an.frequencyBinCount), peaks: new Array(N).fill(0),
             color: getComputedStyle(root).getPropertyValue('--c').trim() || '#22d3ee' };
  });
  function draw() {
    requestAnimationFrame(draw);
    if (document.hidden) return;
    for (const sp of specs) {
      const w = sp.cv.clientWidth, h = sp.cv.clientHeight;
      if (sp.cv.width !== Math.round(w * dpr)) { sp.cv.width = Math.round(w * dpr); sp.cv.height = Math.round(h * dpr); }
      const g = sp.g; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
      sp.an.getByteFrequencyData(sp.data);
      const bw = w / N, gap = Math.max(1.5, bw * 0.22);
      const grad = g.createLinearGradient(0, h, 0, 0);
      grad.addColorStop(0, sp.color + '55'); grad.addColorStop(1, sp.color);
      for (let i = 0; i < N; i++) {
        const lo = Math.floor(Math.pow(i / N, 1.7) * 100) + 1;
        const hi = Math.max(lo + 1, Math.floor(Math.pow((i + 1) / N, 1.7) * 100) + 1);
        let sum = 0; for (let k = lo; k < hi; k++) sum += sp.data[k];
        const v = Math.min(1, (sum / (hi - lo) / 255) * 1.25);
        const bh = Math.max(2, v * (h - 4));
        g.fillStyle = grad; g.fillRect(i * bw + gap / 2, h - bh, bw - gap, bh);
        sp.peaks[i] = Math.max(v, sp.peaks[i] - 0.012);
        g.fillStyle = '#fff'; g.fillRect(i * bw + gap / 2, h - sp.peaks[i] * (h - 4) - 3, bw - gap, 2);
      }
    }
  }
  draw();
})();
</script>
