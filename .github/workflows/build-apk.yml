name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html
        run: |
          test -f index.html || { echo "ERROR: Walang index.html sa pinakaibabaw ng repo"; ls -la; exit 1; }
          grep -q "TcpSocket" index.html || { echo "ERROR: Luma ang index.html (walang TcpSocket)"; exit 1; }
          grep -q "lame.min.js" index.html || { echo "ERROR: Luma ang index.html (walang lame.min.js)"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project
        run: |
          mkdir -p build-app/www
          cd build-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 lamejs@1.2.1
          cp ../index.html www/index.html
          LAME=$(find node_modules/lamejs -name lame.min.js | head -n 1)
          if [ -n "$LAME" ]; then cp "$LAME" www/lame.min.js; else curl -fsSL https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js -o www/lame.min.js; fi
          test -s www/lame.min.js || { echo "ERROR: Walang lame.min.js"; exit 1; }
          python3 - <<'PYEOF'
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          old = "const Tcp = window.Capacitor && Capacitor.registerPlugin ? Capacitor.registerPlugin('TcpSocket') : null;"
          new = """const Tcp = (() => {
            const C = window.Capacitor;
            if (!C) return null;
            if (C.Plugins && C.Plugins.TcpSocket) return C.Plugins.TcpSocket;
            if (C.registerPlugin) return C.registerPlugin('TcpSocket');
            if (C.nativePromise) return new Proxy({}, { get: (_, m) => (o) => C.nativePromise('TcpSocket', m, o || {}) });
            return null;
          })();"""
          assert old in s, 'ERROR: Hindi mahanap ang linya ng Tcp sa index.html'
          s = s.replace(old, new)
          old2 = "const b64 = (u) => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };"
          new2 = "const b64 = (u) => { u = new Uint8Array(u.buffer, u.byteOffset, u.byteLength); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };"
          assert old2 in s, 'ERROR: Hindi mahanap ang b64 sa index.html'
          s = s.replace(old2, new2)
          open(p, 'w', encoding='utf-8').write(s)
          PYEOF

      - name: Add Android
        working-directory: build-app
        run: |
          cat > capacitor.config.json <<'JSONEOF'
          {"appId":"com.jeiannefm.mixer","appName":"JEIANNE FM Mixer","webDir":"www"}
          JSONEOF
          npx cap add android
          D=android/app/src/main/java/com/jeiannefm/mixer
          test -d "$D" || { echo "ERROR: Walang folder $D"; find android/app/src/main/java -type d; exit 1; }
          cat > "$D/MainActivity.java" <<'JAVAEOF'
          package com.jeiannefm.mixer;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(TcpSocketPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVAEOF
          cat > "$D/TcpSocketPlugin.java" <<'JAVAEOF'
          package com.jeiannefm.mixer;

          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.net.SocketTimeoutException;

          @CapacitorPlugin(name = "TcpSocket")
          public class TcpSocketPlugin extends Plugin {
              private Socket socket;
              private InputStream in;
              private OutputStream out;

              private void closeQuiet() {
                  try { if (socket != null) socket.close(); } catch (Exception ignored) {}
                  socket = null; in = null; out = null;
              }

              @PluginMethod
              public void connect(PluginCall call) {
                  try {
                      closeQuiet();
                      socket = new Socket();
                      socket.connect(new InetSocketAddress(call.getString("host"), call.getInt("port")), 10000);
                      socket.setTcpNoDelay(true);
                      in = socket.getInputStream();
                      out = socket.getOutputStream();
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Hindi makakonekta: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void write(PluginCall call) {
                  try {
                      out.write(Base64.decode(call.getString("data"), Base64.DEFAULT));
                      out.flush();
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void read(PluginCall call) {
                  String text = "";
                  try {
                      socket.setSoTimeout(call.getInt("timeoutMs", 5000));
                      byte[] buf = new byte[2048];
                      int n = in.read(buf);
                      if (n > 0) text = new String(buf, 0, n, "UTF-8");
                  } catch (SocketTimeoutException ignored) {
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                      return;
                  }
                  JSObject o = new JSObject();
                  o.put("text", text);
                  call.resolve(o);
              }

              @PluginMethod
              public void close(PluginCall call) {
                  closeQuiet();
                  call.resolve();
              }
          }
          JAVAEOF
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><uses-permission android:name="android.permission.WAKE_LOCK" /><application|' "$M"
          grep -q RECORD_AUDIO "$M" || { echo "ERROR: Hindi naidagdag ang mic permission"; cat "$M"; exit 1; }
          npx cap sync android

      - name: Build APK
        working-directory: build-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: JeianneFM-APK
          path: build-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
